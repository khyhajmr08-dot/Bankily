name: Unpack Bankily project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract uploaded project archive and apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ARCHIVE" ]; then
            echo "No project ZIP found; nothing to unpack."
            exit 0
          fi
          unzip -oq "$ARCHIVE" -d .
          rm -f "$ARCHIVE"
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:windowSoftInputMode="adjustPan"/android:windowSoftInputMode="adjustResize"/' android/app/src/main/AndroidManifest.xml
          fi
          cat > README.md <<'EOF'
          # بنكيلي — محاكاة تفاعلية
          
          مشروع تجريبي يحاكي واجهات وتدفق تحويل الأموال وفق الصور المرجعية المرفقة. لا ينفذ تحويلات مالية حقيقية ولا يتصل بمؤسسة مالية.
          
          ## تشغيل نسخة الويب
          ```bash
          npm install
          npm run dev
          ```
          لبناء نسخة النشر: `npm run build`، ومجلد الناتج هو `dist/`.
          
          ## التثبيت كتطبيق
          المشروع مجهز كتطبيق ويب تقدمي PWA. بعد نشره على رابط HTTPS افتح الرابط في Chrome على Android ثم اختر تثبيت التطبيق أو إضافته إلى الشاشة الرئيسية. يجب أن يعمل بعد التثبيت في نافذة مستقلة وفق دعم المتصفح.
          
          ## نسخة Android
          يوجد مشروع Kotlin/Jetpack Compose داخل `android/`. يمكن بناء APK تجريبي من تبويب Actions عبر سير العمل Build Android APK. لم يتم اعتماد APK على أنه مختبر على جهاز فعلي.
          
          ## تنبيه
          هذه محاكاة تعليمية فقط وليست خدمة مصرفية ولا تنفذ تحويلات حقيقية.
          EOF
          mkdir -p .github/workflows
          cat > .github/workflows/android-debug-apk.yml <<'EOF'
          name: Build Android APK
          on:
            workflow_dispatch:
            push:
              paths:
                - "android/**"
                - ".github/workflows/android-debug-apk.yml"
          permissions:
            contents: read
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: "17"
                - uses: android-actions/setup-android@v3
                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: "8.9"
                - name: Build debug APK
                  run: gradle -p android :app:assembleDebug --no-daemon
                - uses: actions/upload-artifact@v4
                  with:
                    name: bankily-debug-apk
                    path: android/app/build/outputs/apk/debug/app-debug.apk
                    if-no-files-found: error
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Extract Bankily app source and apply reviewed fixes"
          git push
